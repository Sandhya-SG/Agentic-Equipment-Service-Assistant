services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aem-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-Equipment Service Assistant}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      MODEL_NAME: ${MODEL_NAME:-llama3.1}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-30}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://localhost:3000}
    volumes:
      # Audit trail, metrics and feedback survive container restarts.
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aem-frontend
    ports:
      - "5000:5000"
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_TIMEOUT: ${BACKEND_TIMEOUT:-120}
      FLASK_ENV: development
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
