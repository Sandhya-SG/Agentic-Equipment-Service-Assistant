name: CI

# Runs on every push/PR to main. This is the automated quality + security
# gate for the LLMSecOps/MLSecOps deliverable (PRD §10, §7.3).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: .:src

jobs:

  # ---------------------------------------------------------------------
  # 1. Lint & format — code quality gate
  # ---------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch comparison revision
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          else
            git fetch --no-tags --depth=1 origin "$GITHUB_EVENT_BEFORE"
          fi

      - name: Ruff check
        run: git diff --name-only --diff-filter=ACMR -z FETCH_HEAD HEAD -- '*.py' | xargs -0 -r ruff check

      - name: Ruff format check
        run: git diff --name-only --diff-filter=ACMR -z FETCH_HEAD HEAD -- '*.py' | xargs -0 -r ruff format --check

  # ---------------------------------------------------------------------
  # 2. Dependency vulnerability scan — supply-chain security
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        # Temporary, topology-specific acceptance is recorded in
        # security/risk_acceptance_chromadb_2026-10-02.md.
        # Do not broaden these ignores; all other findings must fail the job.
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  # ---------------------------------------------------------------------
  # 3. Unit tests — correctness of finished components
  #    (currently: Safety rules, Logging & Monitoring)
  # ---------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests -v --junitxml=unit-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.python-version }}
          path: unit-results.xml

  # ---------------------------------------------------------------------
  # 4. AI security tests — prompt injection / adversarial resistance
  #    This is the concrete evidence for the LLMSecOps deliverable.
  #    Required check: a failure here should block merge.
  # ---------------------------------------------------------------------
  security-tests:
    name: AI Security Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run injection / adversarial test suite
        run: pytest tests/security -v --junitxml=security-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: security-results.xml

  # ---------------------------------------------------------------------
  # 5. Build, scan and publish both application containers
  #    - every run: build both images and scan them with Trivy
  #    - push to main only: publish to GHCR, tagged with the commit SHA
  #      (roll back by redeploying an earlier sha-<commit> tag)
  # ---------------------------------------------------------------------
  build:
    name: Build Containers
    runs-on: ubuntu-latest
    needs: [unit-tests, security-tests, dependency-scan]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.backend
          - service: frontend
            dockerfile: Dockerfile.frontend
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: |
          # GHCR requires a lowercase repository path
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/asa-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.service }} image
        run: docker build --file ${{ matrix.dockerfile }} --tag "$IMAGE:scan" .

      - name: Scan ${{ matrix.service }} image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service }} image
        if: env.PUBLISH == 'true'
        run: |
          docker tag "$IMAGE:scan" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker tag "$IMAGE:scan" "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"

