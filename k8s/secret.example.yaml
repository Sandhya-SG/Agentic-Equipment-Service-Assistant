# EXAMPLE ONLY. Do not put a real key in this file or commit one.
# Create the real secret from your .env with:  python scripts/k8s_secret.py
apiVersion: v1
kind: Secret
metadata:
  name: aem-secrets
  namespace: aem
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  CLARIFICATION_SECRET: "replace-me"  # lets any backend pod continue a clarification (python scripts/k8s_secret.py creates one)
  LANGFUSE_PUBLIC_KEY: "replace-me"  # optional: tracing is on only when both keys are set (python scripts/k8s_langfuse.py enable)
  LANGFUSE_SECRET_KEY: "replace-me"
  LANGFUSE_HOST: "replace-me"  # where the pods send traces, for example http://host.docker.internal:3000 for a local Langfuse
  MONITOR_TOKEN: "replace-me"  # optional: the token an operator needs for the monitoring page (keep it secret)
  REVIEWER_TOKEN: "replace-me"  # optional: the token a human reviewer needs for the review page (keep it secret)
  VERSION_TOKEN: "replace-me"  # optional: lets you read GET /version (scripts/verify_version.py --token)
