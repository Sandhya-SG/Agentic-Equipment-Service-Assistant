apiVersion: v1
kind: ConfigMap
metadata:
  name: aem-config
  namespace: aem
data:
  ENVIRONMENT: "kubernetes"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  # Each replica writes its own hash-chained audit file (named after the pod), because several
  # pods appending to one chain would corrupt it.
  AUDIT_LOG_PER_INSTANCE: "true"
  # The frontend reaches the backend through its Service name.
  BACKEND_URL: "http://backend:8000"
  BACKEND_TIMEOUT: "120"
  # The embedding model is baked into the image. Offline mode stops the Hugging Face lookups
  # that stall startup (and fail the startup probe) when the cluster has no DNS or internet.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # Cost controls. The spend cap is an ESTIMATE kept per pod (each pod has its own ledger on its log volume), so the
  # most the cluster can spend by this measure is the cap times the replicas. Change it, then restart the pods.
  OPENAI_SPEND_CAP_USD: "0.25"
  OPENAI_SPEND_LEDGER: "/app/logs/openai_spend.json"
  # At most this many chat requests per client per minute, counted per pod. The backend is reachable only through the
  # frontend (network policy), which passes the browser's address, so X-Forwarded-For can be trusted here.
  RATE_LIMIT_PER_MINUTE: "30"
  TRUST_FORWARDED_FOR: "true"
