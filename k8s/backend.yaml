apiVersion: apps/v1
# A StatefulSet, not a Deployment: every replica keeps its own audit log on its own persistent volume, under a
# stable name (backend-0, backend-1). A restart or a new image therefore continues the same hash-chained audit file
# instead of starting an empty one (a Deployment pod's logs lived in an emptyDir and went with the pod).
kind: StatefulSet
metadata:
  name: backend
  namespace: aem
  labels: {app: backend, app.kubernetes.io/part-of: aem-service-assistant}
spec:
  replicas: 2
  serviceName: backend                         # the Service below
  podManagementPolicy: Parallel                # replicas start and stop together; their volumes are independent
  selector:
    matchLabels: {app: backend}
  updateStrategy:
    type: RollingUpdate                        # one pod at a time, highest number first, each must be ready before the next
  template:
    metadata:
      labels: {app: backend}
    spec:
      # Kubernetes would inject FRONTEND_PORT=tcp://... and BACKEND_PORT=tcp://... for the Services
      # named frontend and backend, which collide with this app's own settings.
      enableServiceLinks: false
      automountServiceAccountToken: false        # the app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                           # the persistent volume is writable by the non-root user
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 60          # let in-flight (slow) agent requests finish
      # Chroma's SQLite store needs write access even to read (lock/WAL files), so the index baked into
      # the image is copied into a writable volume, which lets the root filesystem stay read-only.
      initContainers:
        - name: seed-index
          image: aem-backend:k8s
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -R /app/chroma_store/. /seed/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi, ephemeral-storage: 64Mi}
          volumeMounts:
            - {name: chroma, mountPath: /seed}
      containers:
        - name: backend
          image: aem-backend:k8s
          imagePullPolicy: IfNotPresent           # local image; use a registry tag in a real cluster
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: aem-config}
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: OPENAI_API_KEY}
            - name: CLARIFICATION_SECRET            # signs the clarification state the client sends back; the same on every pod
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: CLARIFICATION_SECRET, optional: true}
            - name: REVIEWER_TOKEN                  # the human review API needs it; without it the endpoints answer 503
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: REVIEWER_TOKEN, optional: true}
            - name: VERSION_TOKEN                   # protects GET /version; without it the endpoint is off here
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: VERSION_TOKEN, optional: true}
            - name: MONITOR_TOKEN                   # protects GET /api/monitoring and the /monitor page; without it the endpoint answers 503 here
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: MONITOR_TOKEN, optional: true}
            # Langfuse tracing is off unless BOTH keys are in the secret (scripts/k8s_langfuse.py enable). Host and keys
            # come together from the same optional secret, so keys can never be set without the host they belong to.
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: LANGFUSE_PUBLIC_KEY, optional: true}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: LANGFUSE_SECRET_KEY, optional: true}
            - name: LANGFUSE_HOST
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: LANGFUSE_HOST, optional: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true            # writable paths are the mounted volumes below
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 3Gi, ephemeral-storage: 1Gi}
          # Loading torch, the embedding model and the index takes a while: allow up to ~200 s,
          # and restart the container if it never becomes ready.
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:                          # only ready pods receive traffic
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:                           # restart a hung process
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: logs, mountPath: /app/logs}
            - {name: tmp, mountPath: /tmp}
            - {name: chroma, mountPath: /app/chroma_store}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 200Mi}
        - name: chroma
          emptyDir: {sizeLimit: 100Mi}
  # One volume per replica (logs-backend-0, logs-backend-1) for the audit, metrics and feedback logs. They are kept
  # when a pod is deleted or the set is scaled down. In a real deployment, ship them to a durable store as well.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: logs
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aem
  labels: {app: backend}
spec:
  type: ClusterIP
  selector: {app: backend}
  ports:
    - {name: http, port: 8000, targetPort: http}
