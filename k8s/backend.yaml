apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aem
  labels: {app: backend, app.kubernetes.io/part-of: aem-service-assistant}
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # never drop below the desired ready pods
  template:
    metadata:
      labels: {app: backend}
    spec:
      # Kubernetes would inject FRONTEND_PORT=tcp://... and BACKEND_PORT=tcp://... for the Services
      # named frontend and backend, which collide with this app's own settings.
      enableServiceLinks: false
      automountServiceAccountToken: false        # the app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 60          # let in-flight (slow) agent requests finish
      # Chroma's SQLite store needs write access even to read (lock/WAL files), so the index baked into
      # the image is copied into a writable volume, which lets the root filesystem stay read-only.
      initContainers:
        - name: seed-index
          image: aem-backend:k8s
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -R /app/chroma_store/. /seed/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi, ephemeral-storage: 64Mi}
          volumeMounts:
            - {name: chroma, mountPath: /seed}
      containers:
        - name: backend
          image: aem-backend:k8s
          imagePullPolicy: IfNotPresent           # local image; use a registry tag in a real cluster
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: aem-config}
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: aem-secrets, key: OPENAI_API_KEY}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true            # writable paths are the mounted volumes below
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 3Gi, ephemeral-storage: 1Gi}
          # Loading torch, the embedding model and the index takes a while: allow up to ~200 s,
          # and restart the container if it never becomes ready.
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:                          # only ready pods receive traffic
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:                           # restart a hung process
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: logs, mountPath: /app/logs}
            - {name: tmp, mountPath: /tmp}
            - {name: chroma, mountPath: /app/chroma_store}
      volumes:
        # Demo: audit logs live as long as the pod. A real deployment ships them to a durable store.
        - name: logs
          emptyDir: {sizeLimit: 500Mi}
        - name: tmp
          emptyDir: {sizeLimit: 200Mi}
        - name: chroma
          emptyDir: {sizeLimit: 100Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aem
  labels: {app: backend}
spec:
  type: ClusterIP
  selector: {app: backend}
  ports:
    - {name: http, port: 8000, targetPort: http}
